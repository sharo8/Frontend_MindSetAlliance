<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo-mindset-alliance.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MA Workspace — Mindset Alliance</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ma-theme-preference')
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          else document.documentElement.classList.remove('dark')
        } catch (e) {}
      })()
    </script>
    <meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060b1c" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
